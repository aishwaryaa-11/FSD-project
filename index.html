<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Finder</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <nav>
        <div class="logo">
            PG Finder
        </div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">PG Listings</a></li>
            <li><a href="#">Roommates</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <section class="hero">

        <h1>Find Your Perfect PG</h1>

        <p>
            Search verified PGs and roommates
            near your college.
        </p>

        <button id="exploreBtn">
            Explore PGs
        </button>

    </section>
    </section>

<section class="search-section">
    <h2>Find Your PG</h2>

    <select id="location">
        <option>Jaipur</option>
        <option>Delhi</option>
        <option>Kota</option>
    </select>

    <select id="budget">
        <option>Under ₹5000</option>
        <option>Under ₹7000</option>
        <option>Under ₹10000</option>
    </select>

    <button id="searchBtn">Search</button>
</section>

<section class="featured-pgs">
    <section class="featured-pgs">

    <h2>Featured PGs</h2>

    <div class="pg-container">

        <div class="pg-card ">
            <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85" alt="">
            <h3>Sunrise PG</h3>
            <p>Jaipur</p>
            <p>₹6000/month</p>
        </div>

        <div class="pg-card">
            <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858" alt="">
            <h3>Comfort PG</h3>
            <p>Delhi</p>
            <p>₹7000/month</p>
        </div>

        <div class="pg-card">
            <img src="https://images.unsplash.com/photo-1494526585095-c41746248156" alt="">
            <h3>Royal PG</h3>
            <p>Kota</p>
            <p>₹8000/month</p>
        </div>

    </div>

</section>

    <script src="js/script.js"></script>

</body>

</html>
